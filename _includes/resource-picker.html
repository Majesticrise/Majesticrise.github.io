<div class="resource-picker">

      <div class="col-8 col-sm-7 col-md-5">   <!-- 输入框占多数 -->
        <input id="resource-code-input" class="form-control" placeholder="取件码" aria-label="取件码">
      </div>

        <button id="resource-code-btn" class="btn btn-primary btn-block" type="button">提交</button>
      </div>
    </div>
    <div id="resource-feedback" class="mt-3 text-danger" role="status" aria-live="polite"></div>
  </div>
</div>
