name: Beautiful Jekyll CI
on: [push, pull_request]
jobs:
  build:
    name: Build Jekyll
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write   # 部署到 GitHub Pages 需要此权限

    steps:
      - uses: actions/checkout@v4

      # ---------- 检查源文件 ----------
      - name: 📂 Check source files
        run: |
          echo "=== Root directory ==="
          ls -la
          echo ""
          echo "=== _resourceparts directory ==="
          ls -la _resourceparts/ || echo "❌ _resourceparts NOT FOUND"
          echo ""
          echo "=== sample-001.md content (first 30 lines) ==="
          head -30 _resourceparts/sample-001.md || echo "❌ sample-001.md NOT FOUND"
          echo ""
          echo "=== _config.yml (collections section) ==="
          grep -A 5 "collections:" _config.yml || echo "❌ collections not found in _config.yml"

      # ---------- 设置 Node.js ----------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # ---------- 生成资源映射表 ----------
      - name: Generate resource map
        run: node generate-map.js

      # ---------- 安装 Ruby 和 Jekyll 依赖 ----------
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install dependencies
        run: bundle install && bundle exec appraisal install

      # ---------- 配置 Pages ----------
      - name: Setup Pages
        id: configure-pages
        uses: actions/configure-pages@v5

      - name: Setup CI config
        run: |
          echo "---" > _config_ci.yml
          echo "baseurl: ${{ steps.configure-pages.outputs.base_path }}" >> _config_ci.yml

      # ---------- 构建 Jekyll ----------
      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec appraisal jekyll build --future --config _config_ci.yml,_config.yml

      # ---------- 检查生成结果 ----------
      - name: 🔍 Check generated site
        run: |
          echo "=== _site root directory ==="
          ls -la _site/
          echo ""
          echo "=== Looking for resourceparts directory ==="
          find _site -type d -name "resourceparts" || echo "❌ resourceparts directory NOT FOUND"
          echo ""
          echo "=== Looking for sample-001.html ==="
          find _site -name "sample-001.html" || echo "❌ sample-001.html NOT FOUND"
          echo ""
          echo "=== Full directory tree under _site (first 3 levels) ==="
          find _site -maxdepth 3 -type d | sort

      # ---------- 上传构建产物 ----------
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

      # ---------- 🚀 部署到 GitHub Pages（新增关键步骤） ----------
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4