name: Beautiful Jekyll CI
on: [push, pull_request]
jobs:
  build:
    name: Build Jekyll
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---------- 新增：设置 Node.js 环境 ----------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'   # 使用 LTS 版本

      # ---------- 新增：生成资源映射表 ----------
      - name: Generate resource map
        run: node generate-map.js
      # -----------------------------------------

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install dependencies
        run: bundle install && bundle exec appraisal install

      - name: Setup Pages
        id: configure-pages
        uses: actions/configure-pages@v5

      - name: Setup CI config
        run: |
          echo "---" > _config_ci.yml
          echo "baseurl: ${{ steps.configure-pages.outputs.base_path }}" >> _config_ci.yml

      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec appraisal jekyll build --future --config _config_ci.yml,_config.yml

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3