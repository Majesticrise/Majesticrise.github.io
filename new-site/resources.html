<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 站点图标 -->
  <link rel="icon" type="image/png" href="assets/img/avatar-icon.png">

  <!-- 在样式渲染前恢复手动选择的主题，避免深浅色闪烁（见 components.js 的主题切换） -->
  <script>
    try {
      var __theme = localStorage.getItem('lea:theme');
      if (__theme) document.documentElement.dataset.theme = __theme;
    } catch (e) {}
  </script>
  <title>资源 · LEA聊天记录大赏</title>
  <meta name="description" content="输入取件码获取对应资源。">
  <meta name="author" content="Majesticrise">
  <link rel="alternate" type="application/rss+xml" title="LEA聊天记录大赏" href="feed.xml">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="site-main" id="main">
    <div class="container">
      <h1 class="page-title">资源</h1>
      <p class="page-lead">输入取件码获取对应内容。</p>

      <!-- 取件码输入区 -->
      <section class="resource-picker" id="resource-picker">
        <h2 class="resource-picker__title">请输入取件码</h2>
        <p class="resource-picker__desc">
          取件码由站长提供，区分大小写（输入时会忽略大小写容错）。
        </p>

        <form class="code-form" id="code-form" autocomplete="off">
          <input
            type="text"
            id="code-input"
            class="code-input"
            placeholder="取件码"
            aria-label="取件码"
            spellcheck="false">
          <button class="btn btn--primary" type="submit">提交</button>
        </form>

        <p class="code-feedback" id="code-feedback" role="status" aria-live="polite"></p>

        <p class="muted" style="margin-top:18px">
          提示：试试输入今天的日期（<code>YYYY-MM-DD</code> 或 <code>YYYYMMDD</code>）？
        </p>
      </section>

      <!-- 【在这里添加取件码】请修改 assets/data/resources.json -->
      <section class="resource-result" id="resource-result" hidden></section>

    </div>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/site-config.js"></script>
  <script type="module" src="assets/js/resources.js"></script>
</body>
</html>
