# ============================================================
#  注意：GitHub Actions 只会读取 **仓库根目录** 的
#  .github/workflows/ 下的文件。
#  本文件是随项目一起走的模板，实际生效的副本位于
#  仓库根目录：.github/workflows/deploy-new-site.yml
#  两者内容一致，改一处后请同步另一处（或直接删除本模板）。
# ============================================================

name: Deploy new-site to GitHub Pages

on:
  push:
    branches:
      - master        # 当前默认分支
      - main          # 如果以后改名为 main
      - 'test/**'     # 测试分支：只构建，不发布（见下方 if 条件）
    paths:
      - 'new-site/**'
      - '.github/workflows/deploy-new-site.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: '是否真的发布到 GitHub Pages（测试分支保持 false）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# GITHUB_TOKEN 需要的最小权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，避免并发冲突
concurrency:
  group: pages-new-site
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------
  # 1. 构建：安装 Node、生成 posts.json / feed.xml / sitemap.xml
  # ---------------------------------------------------------
  build:
    name: Build static site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 生成文章清单（扫描 posts/*.md 的 Front Matter）
      - name: Generate posts manifest
        working-directory: new-site
        run: node scripts/generate-posts-manifest.js

      # 计算站点地址：用户站是 https://<user>.github.io，
      # 项目站是 https://<user>.github.io/<repo>
      - name: Compute SITE_URL
        id: site
        run: |
          REPO="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"
          if [ "$REPO" = "${OWNER}.github.io" ]; then
            URL="https://${OWNER}.github.io"
          else
            URL="https://${OWNER}.github.io/${REPO}"
          fi
          # 如果发布在新站子目录，请在这里追加子路径，例如 /${URL}/new
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Generate RSS feed
        working-directory: new-site
        env:
          SITE_URL: ${{ steps.site.outputs.url }}
        run: node scripts/generate-feed.js

      - name: Generate sitemap
        working-directory: new-site
        env:
          SITE_URL: ${{ steps.site.outputs.url }}
        run: node scripts/generate-sitemap.js

      - name: Show generated files
        run: |
          echo "::group::posts.json"
          head -n 30 new-site/assets/data/posts.json
          echo "::endgroup::"
          echo "已生成：$(ls -la new-site/feed.xml new-site/sitemap.xml)"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # 只打包 new-site/ 目录，Jekyll 不会介入（目录里有 .nojekyll）
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: new-site

      # 额外上传一份普通 artifact，方便在测试分支下载预览
      - name: Upload preview artifact (zip)
        uses: actions/upload-artifact@v4
        with:
          name: new-site-preview
          path: new-site
          retention-days: 14

  # ---------------------------------------------------------
  # 2. 发布：仅在 master/main 推送，或手动选择 publish=true 时执行
  #    测试分支（test/**）只会跑 build，不会动线上站点。
  # ---------------------------------------------------------
  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest

    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish == 'true')

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
