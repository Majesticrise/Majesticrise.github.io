<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 站点图标 -->
  <link rel="icon" type="image/png" href="assets/img/avatar-icon.png">

  <!-- 在样式渲染前恢复手动选择的主题，避免深浅色闪烁（见 components.js 的主题切换） -->
  <script>
    try {
      var __theme = localStorage.getItem('lea:theme');
      if (__theme) document.documentElement.dataset.theme = __theme;
    } catch (e) {}
  </script>
  <title>文章 · LEA聊天记录大赏</title>
  <meta name="description" content="LEA聊天记录大赏文章详情页。">
  <meta name="author" content="Majesticrise">
  <link rel="alternate" type="application/rss+xml" title="LEA聊天记录大赏" href="feed.xml">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <!-- 阅读进度条（滚动驱动动画，见 style.css 与 article.js 的降级逻辑） -->
  <div class="read-progress" aria-hidden="true"></div>
  <div id="site-header"></div>

  <main class="site-main" id="main">
    <div class="container">
      <div class="article">

        <header class="article-header">
          <p class="breadcrumb" id="article-crumb"></p>
          <h1 class="article-title" id="article-title">加载中…</h1>
          <p class="article-meta" id="article-meta"></p>
          <div class="article-tags" id="article-tags"></div>
        </header>

        <!--
          同步预填标题/日期 + 设置共享元素过渡名（必须发生在首次绘制之前，
          否则跨文档视图过渡的快照会拍到"加载中…"，标题动画就没了）。
          数据来自 sessionStorage 缓存（首页等页面加载文章清单时写入）。
        -->
        <script>
          (function () {
            var id = new URLSearchParams(location.search).get('post');
            if (!id) return;
            var titleEl = document.getElementById('article-title');
            var metaEl = document.getElementById('article-meta');
            // 共享元素过渡名：与列表页标题配对（规则同 components.js 的 vtNameFor）
            titleEl.style.viewTransitionName =
              'post-' + String(id).replace(/[^A-Za-z0-9一-龥-]/g, '');
            try {
              var map = JSON.parse(sessionStorage.getItem('lea:post-titles') || '{}');
              var hit = map[id];
              if (hit) {
                if (hit.t) titleEl.textContent = hit.t;
                if (hit.d && metaEl) {
                  metaEl.innerHTML = '<time datetime="' + hit.d + '">' + hit.d + '</time>';
                }
              }
            } catch (e) { /* 缓存不可用时走正常异步加载 */ }
          })();
        </script>

        <!-- 目录（标题数量不足时自动隐藏） -->
        <nav class="article-toc" id="article-toc" aria-label="文章目录" hidden></nav>

        <!-- Markdown 渲染结果 -->
        <div class="article-body" id="article-body">
          <p class="empty-state">正在读取文章…</p>
        </div>

        <!-- 上一篇 / 下一篇 -->
        <nav class="article-pager" id="article-pager" aria-label="文章导航"></nav>

        <!-- giscus 评论（默认关闭，见 assets/js/site-config.js） -->
        <section class="comments-wrap" id="comments-wrap">
          <h2 class="comments-title">评论</h2>
          <div id="comments"></div>
        </section>

      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/site-config.js"></script>
  <script type="module" src="assets/js/article.js"></script>
</body>
</html>
