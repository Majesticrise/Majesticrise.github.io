<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 站点图标 -->
  <link rel="icon" type="image/png" href="assets/img/avatar-icon.png">

  <!-- 在样式渲染前恢复手动选择的主题，避免深浅色闪烁（见 components.js 的主题切换） -->
  <script>
    try {
      var __theme = localStorage.getItem('lea:theme');
      if (__theme) document.documentElement.dataset.theme = __theme;
    } catch (e) {}
  </script>
  <title>LEA聊天记录大赏</title>
  <meta name="description" content="LEA聊天记录大赏 —— 由 Majesticrise 维护的聊天记录、群像与资源存档站。">
  <meta name="author" content="Majesticrise">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="LEA聊天记录大赏">
  <meta property="og:description" content="记录群聊里的荒诞与快乐。">
  <meta property="og:locale" content="zh_CN">

  <!-- RSS -->
  <link rel="alternate" type="application/rss+xml" title="LEA聊天记录大赏" href="feed.xml">

  <!-- 样式：相对路径，放在任意子目录都能用 -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <!-- 导航栏由 assets/js/components.js 注入（在这里修改导航请改 assets/js/site-config.js） -->
  <div id="site-header"></div>

  <main class="site-main" id="main">
    <div class="container">

      <h1 class="page-title">最新文章</h1>
      <p class="page-lead">群聊记录、梗与一些乱七八糟的存档。</p>

      <!-- 首页小部件：现在时间 / 高考倒计时
           文案与目标日期在 assets/js/site-config.js 的 homeWidgets 里改 -->
      <div class="home-widgets" id="home-widgets">
        <div class="home-widget" id="widget-time" hidden>
          <div class="home-widget__label">现在时间</div>
          <div class="home-widget__value" id="home-time-value">--</div>
        </div>
        <div class="home-widget home-widget--countdown" id="widget-countdown" hidden>
          <div class="home-widget__label">倒计时</div>
          <div class="home-widget__value" id="home-countdown-value">计算中…</div>
        </div>
      </div>

      <!-- 站内搜索：基于 posts.json 的标题 / 摘要 / 标签 -->
      <div class="search-bar">
        <input
          type="search"
          id="search-input"
          class="search-input"
          placeholder="搜索标题、摘要或标签…"
          aria-label="站内搜索">
      </div>
      <p class="search-hint" id="search-hint" role="status" aria-live="polite"></p>

      <!-- 文章列表由 assets/js/main.js 渲染 -->
      <div class="post-list" id="post-list">
        <p class="empty-state">正在加载文章…</p>
      </div>

      <div class="load-more-wrap">
        <button class="btn btn--primary" id="load-more" type="button" hidden>加载更多</button>
        <p class="list-status" id="list-status"></p>
      </div>

    </div>
  </main>

  <!-- 页脚由 assets/js/components.js 注入 -->
  <div id="site-footer"></div>

  <!-- 站点配置必须先加载（普通脚本） -->
  <script src="assets/js/site-config.js"></script>
  <!-- 页面逻辑（ES Module） -->
  <script type="module" src="assets/js/main.js"></script>
</body>
</html>
